# Builds the ready-to-install Windows app in the cloud. Nothing runs on your own PC.
# Every push to "main" (or a click on "Run workflow") produces:
#   - Tangerine-Setup-<version>-x64.exe     (installer)
#   - Tangerine-Portable-<version>-x64.exe  (no install needed)
# published on the repository's Releases page.
name: Build Windows app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
        
      - name: Restore icons
        run: node scripts/restore-assets.mjs
    
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle FFmpeg
        run: node scripts/fetch-binaries.mjs

      - name: Install and Bundle All Binaries (FFmpeg, ImageMagick, qpdf, Pandoc, Ghostscript)
        shell: pwsh
        run: |
          choco install ffmpeg imagemagick qpdf pandoc ghostscript -y --no-progress
          
                    # 1. Bundle FFmpeg
                    $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg*' -Directory | Select-Object -First 1
                    if (-not $ffmpeg) { $ffmpeg = Get-ChildItem 'C:\tools\ffmpeg*' -Directory | Select-Object -First 1 }
                    New-Item -ItemType Directory -Force -Path resources\bin\ffmpeg | Out-Null
                    if ($ffmpeg) { Copy-Item -Recurse -Force (Join-Path $ffmpeg.FullName 'tools\*') resources\bin\ffmpeg\ -ErrorAction SilentlyContinue }
          
                    # 2. Bundle ImageMagick
                    $im = Get-ChildItem 'C:\Program Files\ImageMagick*' -Directory | Sort-Object Name -Descending | Select-Object -First 1
                    New-Item -ItemType Directory -Force -Path resources\bin\magick | Out-Null
                    if ($im) { Copy-Item -Recurse -Force (Join-Path $im.FullName '*') resources\bin\magick\ }
          
                    # 3. Bundle qpdf
                    $qpdf = Get-ChildItem 'C:\ProgramData\chocolatey\lib\qpdf*' -Directory | Select-Object -First 1
                    New-Item -ItemType Directory -Force -Path resources\bin\qpdf | Out-Null
                    if ($qpdf) { Copy-Item -Recurse -Force (Join-Path $qpdf.FullName 'tools\*') resources\bin\qpdf\ -ErrorAction SilentlyContinue }
          
                    # 4. Bundle Pandoc
                    $pandoc = Get-ChildItem 'C:\ProgramData\chocolatey\lib\pandoc*' -Directory | Select-Object -First 1
                    New-Item -ItemType Directory -Force -Path resources\bin\pandoc | Out-Null
                    if ($pandoc) { Copy-Item -Recurse -Force (Join-Path $pandoc.FullName 'tools\*') resources\bin\pandoc\ -ErrorAction SilentlyContinue }
          
                    # 5. Bundle Ghostscript
                    $gs = Get-ChildItem 'C:\Program Files\gs' -Directory | Sort-Object Name -Descending | Select-Object -First 1
                    New-Item -ItemType Directory -Force -Path resources\bin\gs | Out-Null
                    if ($gs) {
                        Copy-Item -Recurse -Force (Join-Path $gs.FullName 'bin') resources\bin\gs\
                        Copy-Item -Recurse -Force (Join-Path $gs.FullName 'lib') resources\bin\gs\ -ErrorAction SilentlyContinue
                    }
        
      - name: Verify bundled tools
        run: node scripts/verify-binaries.mjs

      - name: Compile
        run: npm run build

      - name: Package installer + portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tangerine-Windows
          path: release/*.exe

      - name: Publish release for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tangerine for Windows (build ${{ github.run_number }})
          make_latest: true
          body: |
            **Download one of these and you're done:**
            - `Tangerine-Setup-...-x64.exe`: installs Tangerine (no admin rights needed) and starts it in the system tray.
            - `Tangerine-Portable-...-x64.exe`: runs without installing.

            Then hold **Shift** and drag any file.

            Windows may show "Windows protected your PC" because the app isn't code-signed. Click **More info**, then **Run anyway**.
            Documents to PDF also needs the free LibreOffice: https://www.libreoffice.org/download/
          files: release/*.exe
