# Builds the ready-to-install Windows app in the cloud. Nothing runs on your own PC.
# Every push to "main" (or a click on "Run workflow") produces:
#   - Tangerine-Setup-<version>-x64.exe     (installer)
#   - Tangerine-Portable-<version>-x64.exe  (no install needed)
# published on the repository's Releases page.
name: Build Windows app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
        
      - name: Restore icons
        run: node scripts/restore-assets.mjs
    
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install and Bundle All Binaries (FFmpeg, ImageMagick, qpdf, Pandoc, Ghostscript)
        shell: pwsh
        run: |
                choco install ffmpeg imagemagick qpdf pandoc ghostscript -y --no-progress
      
                # Create required target directories
                New-Item -ItemType Directory -Force -Path resources\bin | Out-Null
                New-Item -ItemType Directory -Force -Path resources\bin\imagemagick | Out-Null
                New-Item -ItemType Directory -Force -Path resources\bin\qpdf\bin | Out-Null
                New-Item -ItemType Directory -Force -Path resources\bin\pandoc | Out-Null
                New-Item -ItemType Directory -Force -Path resources\bin\gs | Out-Null
      
                # 1. FFmpeg & ffprobe
                $ffmpeg = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
                $ffprobe = (Get-Command ffprobe -ErrorAction SilentlyContinue).Source
                if ($ffmpeg) { Copy-Item $ffmpeg -Destination resources\bin\ -Force }
                if ($ffprobe) { Copy-Item $ffprobe -Destination resources\bin\ -Force }
      
                # 2. ImageMagick (magick.exe)
                $magick = (Get-Command magick -ErrorAction SilentlyContinue).Source
                if (-not $magick) {
                    $imDir = Get-ChildItem 'C:\Program Files\ImageMagick*' -Directory | Sort-Object Name -Descending | Select-Object -First 1
                    if ($imDir) { $magick = Join-Path $imDir.FullName 'magick.exe' }
                }
                if ($magick -and (Test-Path $magick)) {
                    Copy-Item $magick -Destination resources\bin\imagemagick\ -Force
                }
      
                # 3. qpdf
                $qpdf = (Get-Command qpdf -ErrorAction SilentlyContinue).Source
                if ($qpdf) {
                    $qpdfBinDir = Split-Path $qpdf -Parent
                    Copy-Item (Join-Path $qpdfBinDir '*') -Destination resources\bin\qpdf\bin\ -Recurse -Force
                }
      
                # 4. Pandoc
                $pandoc = (Get-Command pandoc -ErrorAction SilentlyContinue).Source
                if ($pandoc) {
                    Copy-Item $pandoc -Destination resources\bin\pandoc\ -Force
                }
      
                # 5. Ghostscript
                $gs = Get-ChildItem 'C:\Program Files\gs' -Directory | Sort-Object Name -Descending | Select-Object -First 1
                if ($gs) {
                    Copy-Item -Recurse -Force (Join-Path $gs.FullName 'bin') resources\bin\gs\
                    Copy-Item -Recurse -Force (Join-Path $gs.FullName 'lib') resources\bin\gs\ -ErrorAction SilentlyContinue
                }
        
      - name: Verify bundled tools
        run: node scripts/verify-binaries.mjs

      - name: Compile
        run: npm run build

      - name: Package installer + portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tangerine-Windows
          path: release/*.exe

      - name: Publish release for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tangerine for Windows (build ${{ github.run_number }})
          make_latest: true
          body: |
            **Download one of these and you're done:**
            - `Tangerine-Setup-...-x64.exe`: installs Tangerine (no admin rights needed) and starts it in the system tray.
            - `Tangerine-Portable-...-x64.exe`: runs without installing.

            Then hold **Shift** and drag any file.

            Windows may show "Windows protected your PC" because the app isn't code-signed. Click **More info**, then **Run anyway**.
            Documents to PDF also needs the free LibreOffice: https://www.libreoffice.org/download/
          files: release/*.exe
